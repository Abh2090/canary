name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Login to ECR
      run: |
        aws ecr get-login-password --region us-east-1 | \
        docker login --username AWS --password-stdin  851725487982.dkr.ecr.us-east-1.amazonaws.com

    - name: Build Docker image
      run: |
        docker build -t devops-app .

    - name: Tag image
      run: |
        docker tag devops-app:latest 851725487982.dkr.ecr.us-east-1.amazonaws.com/devops-app:latest

    - name: Push to ECR
      run: |
        docker push 851725487982.dkr.ecr.us-east-1.amazonaws.com/devops-app:latest

    - name: Update kubeconfig
      run: |
        aws eks update-kubeconfig --region us-east-1 --name devops-cluster

    - name: Deploy to EKS
      run: |
        kubectl set image deployment/backend-green backend=851725487982.dkr.ecr.us-east-1.amazonaws.com/devops-app:latest -n dev
