apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
  namespace: dev
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

    # 🔥 Canary routing (initial values - pipeline will override)
    alb.ingress.kubernetes.io/actions.forward-multiple: >
      {
        "Type": "forward",
        "ForwardConfig": {
          "TargetGroups": [
            {
              "ServiceName": "backend-blue-svc",
              "ServicePort": "80",
              "Weight": 80
            },
            {
              "ServiceName": "backend-green-svc",
              "ServicePort": "80",
              "Weight": 20
            }
          ]
        }
      }

spec:
  ingressClassName: alb
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend-green-svc   # ✅ placeholder (must be real service)
            port:
              number: 80
